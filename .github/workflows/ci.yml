name: CI & Engineering Maturity Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sdk-tests:
    name: Python SDK (Pytest & Typing)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python-sdk[test]"
          pip install httpx pydantic typing-extensions

      - name: Run Python SDK Unit Tests
        run: |
          cd python-sdk
          pytest -v

      - name: Typecheck with Mypy
        run: |
          cd python-sdk
          mypy src

      - name: Lint with Ruff
        run: |
          cd python-sdk
          ruff check src tests

  javascript-sdk-tests:
    name: JavaScript / TypeScript SDK (Vitest & Build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: js-sdk/package-lock.json

      - name: Install Dependencies
        run: |
          cd js-sdk
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd js-sdk
          npm run typecheck

      - name: Run Vitest Suite (Unit & Benchmarks)
        run: |
          cd js-sdk
          npm test

      - name: Build SDK Bundle (ESM + CJS + Types)
        run: |
          cd js-sdk
          npm run build

  documentation-build:
    name: MkDocs Documentation Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Dependencies
        run: |
          pip install mkdocs mkdocs-material "mkdocstrings[python]" pymdown-extensions
          pip install ./python-sdk

      - name: Verify Documentation Build (Strict)
        run: |
          mkdocs build --strict
