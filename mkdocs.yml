site_name: N-ATLaS Toolkit Documentation
site_description: Production Serverless, Sovereign LLM & Multilingual Nigerian ASR (Hausa, Igbo, Nigerian English, Yoruba)
site_author: Awarri Technologies / Federal Ministry of Communications, Innovation and Digital Economy
site_url: https://samolubukun.github.io/N-Atlas-Toolkit/
repo_name: samolubukun/N-Atlas-Toolkit
repo_url: https://github.com/samolubukun/N-Atlas-Toolkit
use_directory_urls: false
copyright: 'Built by <a href="http://samuelolubukun.com/" target="_blank" rel="noopener">Samuel Olubukun</a>'

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/samolubukun/N-Atlas-Toolkit
      name: GitHub
    - icon: fontawesome/solid/globe
      link: http://samuelolubukun.com/
      name: Samuel Olubukun
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/natlas-sdk/
      name: PyPI
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/natlas-sdk
      name: npm

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Getting Started:
      - Overview: index.md
      - Installation & Quickstart: getting-started/install.md
      - Model Catalog: getting-started/models.md
  - SDK & CLI Guides:
      - Python SDK: sdk/python.md
      - JavaScript / TypeScript SDK: sdk/javascript.md
      - Built-in Agent Tools: sdk/tools.md
      - Unified CLI Reference: cli.md
      - Developer Cookbook: cookbook.md
  - LLM Capabilities:
      - Chat & SSE Streaming: llm/chat.md
  - ASR (Speech-to-Text):
      - Audio Transcriptions: asr/transcriptions.md
      - Voice Input & Audio Architecture: asr/streaming.md
      - ASR Benchmarks & WER/CER: asr/benchmarks.md
  - Fine-Tuning Starter Kit:
      - Overview & LoRA Pipeline: finetuning/overview.md
      - Dataset Preparation: finetuning/data-prep.md
      - Model Evaluation & Comparison: finetuning/evaluation.md
  - Deployment & Infrastructure:
      - Modal Cloud Serverless: deployment/modal.md
      - Lightning AI Serverless: deployment/lightning.md
      - Docker GPU & CPU Gateway: deployment/docker.md
      - Performance & Quantization: deployment/performance.md
  - API Reference:
      - REST Endpoints: api/endpoints.md
      - Python SDK Auto-Docs: api/python-sdk.md
  - Troubleshooting: troubleshooting.md
  - Harshen Hausa (Hausa Docs):
      - Farawa Cikin Sauri (Overview & Quickstart): ha/index.md
      - Ƙirar Model (Models & Architecture): ha/models.md
      - Tura Fasaha (Deployment): ha/deployment.md
  - Asụsụ Igbo (Igbo Docs):
      - Mbido Ọsọ Ọsọ (Overview & Quickstart): ig/index.md
      - Ụdị Ụbụrụ Nghọta (Models & Architecture): ig/models.md
      - Mbupụ na Mmejuputa (Deployment): ig/deployment.md
  - Èdè Yorùbá (Yoruba Docs):
      - Ìbẹ̀rẹ̀ Kíákíá (Overview & Quickstart): yo/index.md
      - Àwọn Ohun Èlò Ìṣirò (Models & Architecture): yo/models.md
      - Ìgbéjáde (Deployment): yo/deployment.md
