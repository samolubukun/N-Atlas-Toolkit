[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas"
version = "0.1.0"
description = "Python SDK for Nigeria's sovereign N-ATLaS multilingual LLM and Whisper ASR models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "National AI Innovation Challenge contributors" }]
keywords = [
  "n-atlas",
  "nigerian-languages",
  "llm",
  "asr",
  "speech-recognition",
  "multimodal",
  "yoruba",
  "hausa",
  "igbo",
  "transformers",
  "vllm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typing-extensions>=4.12",
]

[project.scripts]
natlas = "natlas.cli:main"

[tool.setuptools]
package-dir = {"natlas" = "src"}
packages = ["natlas"]

[project.optional-dependencies]
local = [
  "accelerate>=0.34,<2",
  "librosa>=0.10",
  "soundfile>=0.12",
  "torch>=2.1",
  "transformers>=4.46,<5",
]
test = [
  "build>=1.2,<2",
  "setuptools>=72",
  "wheel",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.package-data]
"natlas" = ["tools/data/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]
