[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-sdk"
version = "0.1.1"
description = "Python SDK for Nigeria's sovereign N-ATLaS multilingual LLM and Whisper ASR models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Olubukun" }]
keywords = [
  "n-atlas",
  "nigerian-languages",
  "llm",
  "asr",
  "speech-recognition",
  "multimodal",
  "yoruba",
  "hausa",
  "igbo",
  "nigerian-english",
  "african-nlp",
  "transformers",
  "vllm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typing-extensions>=4.12",
]

[project.urls]
"Homepage" = "https://huggingface.co/NCAIR1"
"Source" = "https://github.com/samolubukun/N-Atlas-Toolkit"
"Bug Tracker" = "https://github.com/samolubukun/N-Atlas-Toolkit/issues"

[project.scripts]
natlas = "natlas.cli:main"

# ---------------------------------------------------------------------------
# Packaging layout
#
# The source lives in src/ directly (src/__init__.py is the natlas package).
# We explicitly enumerate the packages and map their directories so that only
# natlas/* ends up in the wheel — the raw "src" name is never included.
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = ["natlas", "natlas.tools", "natlas.tools.data"]

[tool.setuptools.package-dir]
"natlas"            = "src"
"natlas.tools"      = "src/tools"
"natlas.tools.data" = "src/tools/data"

[tool.setuptools.package-data]
"natlas"       = ["py.typed"]
"natlas.tools" = ["data/*.json"]

# ---------------------------------------------------------------------------
# Optional dependencies
# ---------------------------------------------------------------------------
[project.optional-dependencies]
local = [
  "accelerate>=0.34,<2",
  "librosa>=0.10",
  "soundfile>=0.12",
  "torch>=2.1",
  "transformers>=4.46,<5",
]
test = [
  "build>=1.2,<2",
  "setuptools>=77",
  "wheel",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

# ---------------------------------------------------------------------------
# Dev tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]
