events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Support large audio file uploads for transcription (up to 100MB)
    client_max_body_size 100M;

    upstream vllm_backend {
        server natlas-vllm:8000;
    }

    upstream asr_backend {
        server natlas-asr:8001;
    }

    server {
        listen 8000;
        server_name localhost;

        # Sovereign ASR endpoints -> routed to natlas-asr
        location ~ ^/v1/audio/(.*)$ {
            proxy_pass http://asr_backend/v1/audio/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Sovereign ASR WebSocket streaming endpoint
        location /v1/audio/transcriptions/streaming {
            proxy_pass http://asr_backend/v1/audio/transcriptions/streaming;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ASR documentation endpoint
        location /docs/asr {
            proxy_pass http://asr_backend/docs;
            proxy_set_header Host $host;
        }

        # All LLM Chat completions, models, and vLLM Swagger docs -> routed to natlas-vllm
        location / {
            proxy_pass http://vllm_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;

            # Enable SSE (Server-Sent Events) streaming for chat completions
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }
    }
}
