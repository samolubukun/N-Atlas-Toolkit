events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Support large audio file uploads for transcription (up to 100MB)
    client_max_body_size 100M;

    upstream vllm_backend {
        server natlas-vllm:8000;
    }

    upstream asr_backend {
        server natlas-asr:8001;
    }

    server {
        listen 8000;
        server_name localhost;

        # Sovereign ASR endpoints -> natlas-asr
        location ~ ^/v1/audio/(.*)$ {
            proxy_pass http://asr_backend/v1/audio/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ASR documentation endpoint
        location /docs/asr {
            proxy_pass http://asr_backend/docs;
            proxy_set_header Host $host;
        }


        # Connection '' + chunked_transfer_encoding on is required for SSE to stream
            proxy_pass http://vllm_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        # Catch-all: Swagger UI, OpenAPI JSON, etc.
        location / {
            proxy_pass http://vllm_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }
    }
}
